name: Svipe Windows.

# Svipe Desktop for Windows, built on GitHub's Windows runners: there is no Windows machine in the
# release loop, and MSVC cannot run on the Mac. Started by hand (or by svipe-tools), never on push —
# the upstream workflows in this fork are disabled for the same reason: a push must not start five
# Windows builds and a set of issue bots.
#
# Derived from upstream's win.yml (x64, default Qt), with Svipe's own API keys from the repository
# secrets and a Release build. The first run builds every library from source and is long; the
# ThirdParty, Libraries and Qt caches make the following ones a fraction of that. `only_cache` stops
# after the libraries, so a cold cache can be filled by a run that fits inside the job time limit.

on:
  workflow_dispatch:
    inputs:
      only_cache:
        description: "Build the libraries only (fills the cache)"
        type: boolean
        default: false

jobs:

  windows:
    name: Windows x64
    runs-on: windows-latest
    timeout-minutes: 360

    env:
      PREPARE_PATH: "Telegram/build/prepare/prepare.py"

    defaults:
      run:
        shell: cmd

    steps:
      - name: Prepare directories.
        run: |
          mkdir %userprofile%\TBuild\Libraries
          mklink /d %GITHUB_WORKSPACE%\TBuild %userprofile%\TBuild
          echo TBUILD=%GITHUB_WORKSPACE%\TBuild>>%GITHUB_ENV%
          echo LibrariesPath=%GITHUB_WORKSPACE%\TBuild\Libraries\win64>>%GITHUB_ENV%

      - name: Get repository name.
        shell: bash
        run: echo "REPO_NAME=${GITHUB_REPOSITORY##*/}" >> $GITHUB_ENV

      - name: Clone.
        uses: actions/checkout@v7
        with:
          submodules: recursive
          path: ${{ env.TBUILD }}\${{ env.REPO_NAME }}

      - name: First set up.
        shell: bash
        run: |
          DOCPATH=$TBUILD/$REPO_NAME/docs/building-win.md
          SDK="$(grep "SDK version" $DOCPATH | sed -r 's/.*\*\*(.*)\*\* SDK version.*/\1/')"
          echo "SDK=$SDK" >> $GITHUB_ENV

          sed -i '/CMAKE_${lang}_FLAGS_DEBUG_INIT/s/${_Zi}//' "$PROGRAMFILES"/CMake/share/cmake*/Modules/Platform/Windows-MSVC.cmake

          echo "$(sha256sum $TBUILD/$REPO_NAME/$PREPARE_PATH | awk '{ print $1 }')" >> CACHE_KEY.txt
          echo "$SDK" >> CACHE_KEY.txt
          echo "CACHE_KEY=$(sha256sum CACHE_KEY.txt | awk '{ print $1 }')" >> $GITHUB_ENV

          git config --global user.email "ci@svipe.uz"
          git config --global user.name "Svipe CI"

      - uses: Eden-CI/msvc-dev-cmd@master
        name: Native Tools Command Prompt.
        with:
          arch: x64
          sdk: ${{ env.SDK }}
          toolset: '14.44'

      - name: NuGet sources.
        run: |
          nuget sources Disable -Name "Microsoft Visual Studio Offline Packages"
          nuget sources Add -Source https://api.nuget.org/v3/index.json & exit 0

      - name: ThirdParty cache.
        id: third-party
        uses: actions/cache/restore@v6
        with:
          path: ${{ env.TBUILD }}\ThirdParty
          key: ${{ runner.OS }}-${{ runner.arch }}-third-party-${{ env.CACHE_KEY }}
          restore-keys: ${{ runner.OS }}-${{ runner.arch }}-third-party-

      - name: Libraries cache.
        id: libs
        uses: actions/cache/restore@v6
        with:
          path: |
            ${{ env.LibrariesPath }}\*
            !${{ env.LibrariesPath }}\cache_keys
            !${{ env.LibrariesPath }}\[qQ]t[_-]*
            ${{ env.LibrariesPath }}\cache_keys\*
            !${{ env.LibrariesPath }}\cache_keys\[qQ]t[_-]*
          key: ${{ runner.OS }}-x64-libs-v2-${{ env.CACHE_KEY }}
          restore-keys: ${{ runner.OS }}-x64-libs-v2-

      - name: Qt cache.
        id: qt
        uses: actions/cache/restore@v6
        with:
          path: |
            ${{ env.LibrariesPath }}\[qQ]t[_-]*
            ${{ env.LibrariesPath }}\cache_keys\[qQ]t[_-]*
          key: ${{ runner.OS }}-x64-qt-${{ env.CACHE_KEY }}
          restore-keys: ${{ runner.OS }}-x64-qt-

      # Without skip-release: upstream CI builds Debug only, Svipe ships Release, and a Release link
      # against Debug-only libraries fails on avif.lib / tg_angle.lib. A stage's cache key is built
      # from its commands, so the stages with release parts rebuild and the rest come from the cache.
      - name: Libraries.
        run: |
          %TBUILD%\%REPO_NAME%\Telegram\build\prepare\win.bat silent

      # Upstream's clean-up keeps headers and libraries only. The wallet binding's generated .cpp
      # (tdesktop_rust/out/src) is a SOURCE the app compiles, so it is kept too — without it the
      # configure step fails with "Cannot find source file: ...wallet_engine.cpp".
      - name: Free up some disk space.
        shell: bash
        run: find $LibrariesPath '(' '(' ! '(' -name '*.lib' -o -name '*.a' -o -name '*.exe' -o -name '*.h' -o -name '*.hpp' -o -name '*.inc' -o -name '*.cmake' -o -name '*.pc' -o -path '*/include/*' -o -path '*/objects-*' -o -path '*/cache_keys/*' -o -path '*/patches/*' -o -path '*/nv-codec-headers/*' -o -path '*/tdesktop_rust/out/*' ')' -type f ')' -o -empty ')' -delete

      # Saved here, not at the end of the job: actions/cache saves only when the whole job succeeds,
      # so one failed compile used to throw away an hour of libraries and the next run rebuilt them.
      - name: Save ThirdParty cache.
        if: steps.third-party.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: ${{ env.TBUILD }}\ThirdParty
          key: ${{ runner.OS }}-${{ runner.arch }}-third-party-${{ env.CACHE_KEY }}

      - name: Save Libraries cache.
        if: steps.libs.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: |
            ${{ env.LibrariesPath }}\*
            !${{ env.LibrariesPath }}\cache_keys
            !${{ env.LibrariesPath }}\[qQ]t[_-]*
            ${{ env.LibrariesPath }}\cache_keys\*
            !${{ env.LibrariesPath }}\cache_keys\[qQ]t[_-]*
          key: ${{ runner.OS }}-x64-libs-v2-${{ env.CACHE_KEY }}

      - name: Save Qt cache.
        if: steps.qt.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: |
            ${{ env.LibrariesPath }}\[qQ]t[_-]*
            ${{ env.LibrariesPath }}\cache_keys\[qQ]t[_-]*
          key: ${{ runner.OS }}-x64-qt-${{ env.CACHE_KEY }}

      - name: Svipe Desktop build.
        if: ${{ !inputs.only_cache }}
        env:
          API_ID: ${{ secrets.TDESKTOP_API_ID }}
          API_HASH: ${{ secrets.TDESKTOP_API_HASH }}
        run: |
          cd %TBUILD%\%REPO_NAME%\Telegram

          call configure.bat x64 ^
          -D TDESKTOP_API_ID=%API_ID% ^
          -D TDESKTOP_API_HASH=%API_HASH% ^
          -D CMAKE_CONFIGURATION_TYPES=Release ^
          -D DESKTOP_APP_DISABLE_AUTOUPDATE=OFF ^
          -D DESKTOP_APP_DISABLE_CRASH_REPORTS=ON

          cmake --build ..\out --config Release --parallel

      - name: Collect the build.
        if: ${{ !inputs.only_cache }}
        run: |
          set OUT=%TBUILD%\%REPO_NAME%\out\Release
          dir %OUT%
          mkdir artifact
          copy %OUT%\*.exe artifact\

      - uses: actions/upload-artifact@v7
        name: Upload the build.
        if: ${{ !inputs.only_cache }}
        with:
          name: svipe-desktop-win64
          path: artifact\
          retention-days: 7
