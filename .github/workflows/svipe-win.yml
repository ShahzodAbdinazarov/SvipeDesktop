name: Svipe Windows.

# Svipe Desktop for Windows, built on GitHub's Windows runners: there is no Windows machine in the
# release loop, and MSVC cannot run on the Mac. Started by hand (or by svipe-tools), never on push —
# the upstream workflows in this fork are disabled for the same reason: a push must not start five
# Windows builds and a set of issue bots.
#
# Derived from upstream's win.yml (x64, default Qt), with Svipe's own API keys from the repository
# secrets and a Release build. The first run builds every library from source and is long; the
# ThirdParty, Libraries and Qt caches make the following ones a fraction of that. `only_cache` stops
# after the libraries, so a cold cache can be filled by a run that fits inside the job time limit.

on:
  workflow_dispatch:
    inputs:
      only_cache:
        description: "Build the libraries only (fills the cache)"
        type: boolean
        default: false

jobs:

  windows:
    name: Windows x64
    runs-on: windows-latest
    timeout-minutes: 360

    env:
      PREPARE_PATH: "Telegram/build/prepare/prepare.py"

    defaults:
      run:
        shell: cmd

    steps:
      - name: Prepare directories.
        run: |
          mkdir %userprofile%\TBuild\Libraries
          mklink /d %GITHUB_WORKSPACE%\TBuild %userprofile%\TBuild
          echo TBUILD=%GITHUB_WORKSPACE%\TBuild>>%GITHUB_ENV%
          echo LibrariesPath=%GITHUB_WORKSPACE%\TBuild\Libraries\win64>>%GITHUB_ENV%

      - name: Get repository name.
        shell: bash
        run: echo "REPO_NAME=${GITHUB_REPOSITORY##*/}" >> $GITHUB_ENV

      - name: Clone.
        uses: actions/checkout@v7
        with:
          submodules: recursive
          path: ${{ env.TBUILD }}\${{ env.REPO_NAME }}

      - name: First set up.
        shell: bash
        run: |
          DOCPATH=$TBUILD/$REPO_NAME/docs/building-win.md
          SDK="$(grep "SDK version" $DOCPATH | sed -r 's/.*\*\*(.*)\*\* SDK version.*/\1/')"
          echo "SDK=$SDK" >> $GITHUB_ENV

          sed -i '/CMAKE_${lang}_FLAGS_DEBUG_INIT/s/${_Zi}//' "$PROGRAMFILES"/CMake/share/cmake*/Modules/Platform/Windows-MSVC.cmake

          echo "$(sha256sum $TBUILD/$REPO_NAME/$PREPARE_PATH | awk '{ print $1 }')" >> CACHE_KEY.txt
          echo "$SDK" >> CACHE_KEY.txt
          echo "CACHE_KEY=$(sha256sum CACHE_KEY.txt | awk '{ print $1 }')" >> $GITHUB_ENV

          git config --global user.email "ci@svipe.uz"
          git config --global user.name "Svipe CI"

      # The Release half of prepare builds breakpad's dump_syms, which includes ATL headers. The
      # runner's VS has ATL only for its default toolset, not for the pinned 14.44 one, so
      # the libraries failed on 'atlbase.h' (upstream CI never builds Release libraries).
      - name: ATL for the 14.44 toolset.
        shell: pwsh
        run: |
          $installer = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer"
          $vs = & "$installer\vswhere.exe" -latest -property installationPath
          $p = Start-Process -FilePath "$installer\setup.exe" -Wait -PassThru -ArgumentList `
            'modify','--installPath',"`"$vs`"", `
            '--add','Microsoft.VisualStudio.Component.VC.ATL', `
            '--add','Microsoft.VisualStudio.Component.VC.14.44.17.14.ATL', `
            '--quiet','--norestart','--nocache'
          if ($p.ExitCode -ne 0 -and $p.ExitCode -ne 3010) { exit $p.ExitCode }
          Get-ChildItem "$vs\VC\Tools\MSVC\14.44*\atlmfc\include\atlbase.h" | Select-Object -First 1 FullName

      - uses: Eden-CI/msvc-dev-cmd@master
        name: Native Tools Command Prompt.
        with:
          arch: x64
          sdk: ${{ env.SDK }}
          toolset: '14.44'

      - name: NuGet sources.
        run: |
          nuget sources Disable -Name "Microsoft Visual Studio Offline Packages"
          nuget sources Add -Source https://api.nuget.org/v3/index.json & exit 0

      - name: ThirdParty cache.
        id: third-party
        uses: actions/cache/restore@v6
        with:
          path: ${{ env.TBUILD }}\ThirdParty
          key: ${{ runner.OS }}-${{ runner.arch }}-third-party-${{ env.CACHE_KEY }}
          restore-keys: ${{ runner.OS }}-${{ runner.arch }}-third-party-

      - name: Libraries cache.
        id: libs
        uses: actions/cache/restore@v6
        with:
          path: |
            ${{ env.LibrariesPath }}\*
            !${{ env.LibrariesPath }}\cache_keys
            !${{ env.LibrariesPath }}\[qQ]t[_-]*
            ${{ env.LibrariesPath }}\cache_keys\*
            !${{ env.LibrariesPath }}\cache_keys\[qQ]t[_-]*
          key: ${{ runner.OS }}-x64-libs-v3-${{ env.CACHE_KEY }}
          restore-keys: ${{ runner.OS }}-x64-libs-

      - name: Qt cache.
        id: qt
        uses: actions/cache/restore@v6
        with:
          path: |
            ${{ env.LibrariesPath }}\[qQ]t[_-]*
            ${{ env.LibrariesPath }}\cache_keys\[qQ]t[_-]*
          key: ${{ runner.OS }}-x64-qt-v3-${{ env.CACHE_KEY }}
          restore-keys: ${{ runner.OS }}-x64-qt-

      # Without skip-release: upstream CI builds Debug only, Svipe ships Release, and a Release link
      # against Debug-only libraries fails on avif.lib / tg_angle.lib. A stage's cache key is built
      # from its commands, so the stages with release parts rebuild and the rest come from the cache.
      - name: Libraries.
        run: |
          %TBUILD%\%REPO_NAME%\Telegram\build\prepare\win.bat silent

      # Upstream's clean-up keeps headers and libraries only. The wallet binding's generated .cpp
      # (tdesktop_rust/out/src) is a SOURCE the app compiles, so it is kept too — without it the
      # configure step fails with "Cannot find source file: ...wallet_engine.cpp".
      - name: Free up some disk space.
        shell: bash
        run: find $LibrariesPath '(' '(' ! '(' -name '*.lib' -o -name '*.a' -o -name '*.exe' -o -name '*.h' -o -name '*.hpp' -o -name '*.inc' -o -name '*.cmake' -o -name '*.pc' -o -path '*/include/*' -o -path '*/objects-*' -o -path '*/cache_keys/*' -o -path '*/patches/*' -o -path '*/nv-codec-headers/*' -o -path '*/tdesktop_rust/out/*' ')' -type f ')' -o -empty ')' -delete

      # Saved here, not at the end of the job: actions/cache saves only when the whole job succeeds,
      # so one failed compile used to throw away an hour of libraries and the next run rebuilt them.
      - name: Save ThirdParty cache.
        if: steps.third-party.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: ${{ env.TBUILD }}\ThirdParty
          key: ${{ runner.OS }}-${{ runner.arch }}-third-party-${{ env.CACHE_KEY }}

      - name: Save Libraries cache.
        if: steps.libs.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: |
            ${{ env.LibrariesPath }}\*
            !${{ env.LibrariesPath }}\cache_keys
            !${{ env.LibrariesPath }}\[qQ]t[_-]*
            ${{ env.LibrariesPath }}\cache_keys\*
            !${{ env.LibrariesPath }}\cache_keys\[qQ]t[_-]*
          key: ${{ runner.OS }}-x64-libs-v3-${{ env.CACHE_KEY }}

      - name: Save Qt cache.
        if: steps.qt.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: |
            ${{ env.LibrariesPath }}\[qQ]t[_-]*
            ${{ env.LibrariesPath }}\cache_keys\[qQ]t[_-]*
          key: ${{ runner.OS }}-x64-qt-v3-${{ env.CACHE_KEY }}

      # The installer script is compiled once against stand-in files before the long build, so a
      # mistake in it fails in a minute rather than after the app has compiled.
      - name: Installer script check.
        if: ${{ !inputs.only_cache }}
        shell: bash
        run: |
          set -euo pipefail
          ISCC="/c/Program Files (x86)/Inno Setup 6/ISCC.exe"
          if [ ! -f "$ISCC" ]; then
            choco install innosetup -y --no-progress >/dev/null
          fi
          DUMMY="$RUNNER_TEMP/iss-check"
          mkdir -p "$DUMMY/modules/x64/d3d" "$DUMMY/out"
          echo x > "$DUMMY/Svipe.exe"; echo x > "$DUMMY/Updater.exe"
          echo x > "$DUMMY/modules/x64/d3d/d3dcompiler_47.dll"
          "$ISCC" -Q /dMyAppVersion=0.0.1 "/dReleasePath=$(cygpath -w "$DUMMY")" \
            "/dOutputDir=$(cygpath -w "$DUMMY/out")" \
            "$(cygpath -w "$TBUILD/$REPO_NAME/svipe-tools/setup_win.iss")"
          ls -la "$DUMMY/out"

      # Run 9 (two compilers) still ran out: C3859 "Failed to create virtual memory for PCH" is the
      # system commit limit, not the 16 GB of RAM, and the runner's page file is small. A large page
      # file on the second disk lifts that limit.
      - name: Page file.
        if: ${{ !inputs.only_cache }}
        uses: al-cheb/configure-pagefile-action@v1.4
        with:
          minimum-size: 16GB
          maximum-size: 32GB
          disk-root: "D:"

      # Run 8 still hit C1060 inside Telegram.vcxproj: cmake_helpers passes a bare /MP, which starts
      # one compiler per core and ignores CL_MPCount, so four Release compilers of the app's heaviest
      # sources shared 16 GB. The submodule is patched here rather than forked.
      - name: Two compilers per project.
        if: ${{ !inputs.only_cache }}
        shell: bash
        run: |
          F="$TBUILD/$REPO_NAME/cmake/options_win.cmake"
          sed -i 's|/MP     # Enable multi process build.|/MP2    # Enable multi process build.|' "$F"
          grep -q '/MP2' "$F"

      # Debug and Release libraries together leave too little of C: for a Release build of the app
      # (run 4 compiled every library target, then failed with C1085 "No space left on device"), so
      # the build output lives on the runner's second disk behind a junction at the usual place.
      - name: Svipe Desktop build.
        if: ${{ !inputs.only_cache }}
        env:
          API_ID: ${{ secrets.TDESKTOP_API_ID }}
          API_HASH: ${{ secrets.TDESKTOP_API_HASH }}
        run: |
          wmic logicaldisk get caption,freespace,size
          mkdir D:\svipe-out
          mklink /J %TBUILD%\%REPO_NAME%\out D:\svipe-out

          cd %TBUILD%\%REPO_NAME%\Telegram

          call configure.bat x64 ^
          -D TDESKTOP_API_ID=%API_ID% ^
          -D TDESKTOP_API_HASH=%API_HASH% ^
          -D CMAKE_CONFIGURATION_TYPES=Release ^
          -D DESKTOP_APP_DISABLE_AUTOUPDATE=OFF ^
          -D DESKTOP_APP_DISABLE_CRASH_REPORTS=ON

          rem Release objects of the app are large: with every core compiling at once the runner's
          rem 16 GB ran out (C1060 "compiler is out of heap space" in run 6), so two projects at a
          rem time with two compilers each. Run 7 still hit C1060 on the wallet sources: MSBuild had picked
          rem the 32-bit compiler host, whose address space ends at 4 GB whatever the RAM, so the 64-bit
          rem host is asked for explicitly.
          cmake --build ..\out --config Release --parallel 2 -- /p:CL_MPCount=2 /p:PreferredToolArchitecture=x64

      # The same pieces tdesktop's Telegram/build/build.bat ships: Svipe.exe, Updater.exe and the
      # d3dcompiler module, as an installer and as a v2 update package. The package is only packed
      # here, not signed: the release key never leaves the Mac, where svipe-tools/release_win.sh
      # embeds its signature (Packer -unsigned ... -local-key) and publishes.
      - name: Package.
        if: ${{ !inputs.only_cache }}
        shell: bash
        run: |
          set -euo pipefail
          SRC="$TBUILD/$REPO_NAME"
          OUT="$SRC/out/Release"
          VERSION=$(grep '^AppVersion ' "$SRC/Telegram/build/version" | awk '{print $2}')
          SVIPE_VERSION=$(head -1 "$SRC/Telegram/build/svipe_version")
          ls -la "$OUT"
          for f in Svipe.exe Updater.exe Packer.exe modules/x64/d3d/d3dcompiler_47.dll; do
            [ -f "$OUT/$f" ] || { echo "missing $OUT/$f"; exit 1; }
          done

          ART="$GITHUB_WORKSPACE/artifact"
          mkdir -p "$ART"
          (cd "$OUT" && ./Packer.exe -version "$VERSION" -path Svipe.exe -path Updater.exe \
            -path modules/x64/d3d/d3dcompiler_47.dll -target win64 -channel stable \
            -keys-loc "$(cygpath -w "$SRC/Telegram/Resources/update")" \
            -emit-signing-input signing-input.bin)
          UPDATE="td-update-win-x64-$VERSION"
          [ -f "$OUT/$UPDATE.unsigned" ] || { echo "Packer did not write $UPDATE.unsigned"; exit 1; }
          cp "$OUT/$UPDATE.unsigned" "$OUT/signing-input.bin" "$ART/"

          ISCC="/c/Program Files (x86)/Inno Setup 6/ISCC.exe"
          if [ ! -f "$ISCC" ]; then
            choco install innosetup -y --no-progress >/dev/null
          fi
          "$ISCC" -Q "/dMyAppVersion=$SVIPE_VERSION" "/dReleasePath=$(cygpath -w "$OUT")" \
            "/dOutputDir=$(cygpath -w "$ART")" "$(cygpath -w "$SRC/svipe-tools/setup_win.iss")"
          [ -f "$ART/svipe-desktop-win64-setup.exe" ] || { echo "no installer"; exit 1; }

          mkdir -p "$ART/app/modules/x64/d3d"
          cp "$OUT/Svipe.exe" "$OUT/Updater.exe" "$ART/app/"
          cp "$OUT/modules/x64/d3d/d3dcompiler_47.dll" "$ART/app/modules/x64/d3d/"
          printf '%s\n%s\n' "$VERSION" "$SVIPE_VERSION" > "$ART/version.txt"
          ls -laR "$ART"

      - uses: actions/upload-artifact@v7
        name: Upload the build.
        if: ${{ !inputs.only_cache }}
        with:
          name: svipe-desktop-win64
          path: artifact\
          retention-days: 7
